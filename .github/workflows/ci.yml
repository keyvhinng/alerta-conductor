name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/api/go.mod }
      - run: make lint-api test-api
  driver-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: make lint-monitor test-monitor
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10, package_json_file: apps/dashboard/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/dashboard/pnpm-lock.yaml }
      - run: cd apps/dashboard && pnpm install --frozen-lockfile
      - run: make lint-dashboard test-dashboard build-dashboard
  contracts-and-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make contracts-lint compose-check
